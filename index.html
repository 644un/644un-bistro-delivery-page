
<!DOCTYPE html>
<html>
    <head>
        <title>644un's Awesome Page</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="logo">
            <img src="https://static.vecteezy.com/system/resources/previews/023/979/189/non_2x/online-delivery-service-by-scooter-shopping-website-on-a-mobile-food-order-concept-web-banner-app-template-illustration-vector.jpg" alt="img">
        </div>

        <div class="description">
            <p>This page is the online delivery service for 644un's Bistro, head to <a href="https://www.youtube.com/watch?v=E4WlUXrJgy4">The Menu Page</a> for the menu.</p>
        </div>

        <div class="orderForm">
        <form action="www.google.com" method="get">
            <h2>Online Delivery</h2>
            <div> 
                <fieldset>
                    <legend>Rice</legend>

                    <input type="radio" name="rice" id="white" value="white" required>
                    <label for="white">White</label>

                    <input type="radio" name="rice" id="brown" value="brown"required>
                    <label for="brown">Brown</label>
                </fieldset>
            </div>

            <div>
                <fieldset>
                    <legend>Protein</legend>

                    <input type="checkbox" name="protein" id="chicken" value="chicken">
                    <label for="chicken">Chicken</label>

                    <input type="checkbox" name="protein" id="beef" value="beef">
                    <label for="beef">Beef</label>

                    <input type="checkbox" name="protein" id="Salmon" value="salmon">
                    <label for="salmon">salmon</label>
                </fieldset>
            </div>
            <br>
            <div>
                <label for="drinks">Drinks</label>
                <br>
                <select name="drinks" id="drinks">
                    <option>--Please Select--</option>
                    <optgroup label="Soft Drinks">
                        <option>Coca-Cola</option>
                        <option>Fanta</option>
                    </optgroup>
                    <optgroup label="Store Exclusive Drinks">
                        <option>Tropical Punch</option>
                        <option>Peach Fizz</option>
                    </optgroup>
                </select>
            </div>
            <br>
            <div>
                <label for="feedback">Feedback:</label>
                <br>
                <textarea id="feedback" name="feedback"></textarea>
            </div>

            <br>

            <button>Submit</button>
        </form>
        </div>
    </body>
</html>
